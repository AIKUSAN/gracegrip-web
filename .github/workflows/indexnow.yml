name: Ping IndexNow

# Run manually after the Cloudflare cutover is verified.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ping:
    name: Notify search engines (Bing / DuckDuckGo / Ecosia / Yandex)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No npm ci needed — ping-indexnow.mjs has zero npm dependencies

      - name: Ping IndexNow
        run: node scripts/ping-indexnow.mjs
