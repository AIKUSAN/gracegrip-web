name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 action runner now — avoids deprecation warnings from
# actions/checkout@v4 and actions/setup-node@v4 whose runtimes are being
# migrated from Node 20 → 24 (forced default starting June 2, 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run validate:content

      - name: Test feedback and data handling
        run: npm test

      - name: SEO guard
        run: node scripts/seo-guard.mjs

      - name: Build
        run: npm run build

      - name: Verify static export
        run: npm run verify:export

      - name: Require GraceGrip 2.0 release evidence
        run: npm run verify:v2-release

      - name: Verify production feedback retention Worker
        run: npx wrangler deploy --config wrangler.feedback-retention.jsonc --dry-run --env=''

      - name: Verify preview feedback retention Worker
        run: npx wrangler deploy --config wrangler.feedback-retention.jsonc --dry-run --env=preview
